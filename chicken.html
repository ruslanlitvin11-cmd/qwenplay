<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chicken Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --button-gradient: linear-gradient(180deg, #ffd700 0%, #ffb700 50%, #ff9500 100%);
            --button-shadow: 0 4px 15px rgba(255, 183, 0, 0.4);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --accent-green: #00c853;
            --accent-red: #ff5252;
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: calc(var(--safe-top) + 10px) 16px calc(var(--safe-bottom) + 10px);
        }

        .game-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        /* Logo */
        .logo {
            text-align: center;
            padding: 8px 0;
        }

        .logo h1 {
            font-size: clamp(24px, 5vw, 32px);
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
            letter-spacing: 1px;
        }

        /* Balance Display */
        .balance-display {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .balance-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .balance-amount {
            font-size: clamp(20px, 4vw, 28px);
            font-weight: 700;
            color: #ffd700;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.5);
        }

        /* Chicken Character */
        .chicken-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 8px 0;
        }

        .chicken {
            width: 100%;
            height: 100%;
            font-size: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 4px 15px rgba(255, 255, 255, 0.3));
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Game Board */
        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .tile {
            aspect-ratio: 1;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(24px, 5vw, 32px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .tile:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 215, 0, 0.5);
        }

        .tile:active {
            transform: scale(0.95);
        }

        .tile.revealed {
            animation: reveal 0.4s ease-out;
        }

        .tile.win {
            background: linear-gradient(145deg, rgba(0, 200, 83, 0.3), rgba(0, 150, 60, 0.2));
            border-color: var(--accent-green);
            box-shadow: 0 0 20px rgba(0, 200, 83, 0.4);
        }

        .tile.lose {
            background: linear-gradient(145deg, rgba(255, 82, 82, 0.3), rgba(200, 50, 50, 0.2));
            border-color: var(--accent-red);
            box-shadow: 0 0 20px rgba(255, 82, 82, 0.4);
        }

        @keyframes reveal {
            0% { transform: rotateY(90deg); opacity: 0; }
            100% { transform: rotateY(0); opacity: 1; }
        }

        /* Multiplier Display */
        .multiplier-display {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 170, 0, 0.1));
            border-radius: 12px;
            padding: 10px 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            text-align: center;
        }

        .multiplier-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .multiplier-value {
            font-size: clamp(18px, 4vw, 24px);
            font-weight: 700;
            color: #ffd700;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        .btn {
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            flex: 1;
            max-width: 180px;
            padding: 16px 24px;
            background: var(--button-gradient);
            border-radius: 14px;
            color: #1a1a2e;
            font-size: clamp(14px, 3vw, 16px);
            box-shadow: var(--button-shadow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 183, 0, 0.5);
        }

        .btn-primary:active {
            transform: translateY(1px) scale(0.98);
        }

        .btn-plus {
            width: 56px;
            height: 56px;
            padding: 0;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1));
            border-radius: 14px;
            color: white;
            font-size: 28px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-plus:hover {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.15));
            border-color: rgba(255, 215, 0, 0.5);
        }

        .btn-plus:active {
            transform: scale(0.95);
        }

        .btn-lock {
            flex: 1;
            max-width: 140px;
            padding: 16px 20px;
            background: linear-gradient(180deg, #00c853 0%, #00a843 100%);
            border-radius: 14px;
            color: white;
            font-size: clamp(12px, 2.5vw, 14px);
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.4);
        }

        .btn-lock:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 200, 83, 0.5);
        }

        .btn-lock:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Popups */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: max(var(--safe-top), 20px) 20px max(var(--safe-bottom), 20px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .popup {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 32px 28px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transform: scale(0.9) translateY(20px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .popup-overlay.active .popup {
            transform: scale(1) translateY(0);
        }

        .popup-title {
            font-size: clamp(20px, 4vw, 26px);
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .popup-content {
            margin-bottom: 24px;
        }

        .bonus-text-main {
            font-size: clamp(28px, 6vw, 36px);
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .bonus-text-sub {
            font-size: clamp(18px, 4vw, 22px);
            font-weight: 600;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .bonus-amount {
            font-size: clamp(32px, 7vw, 42px);
            font-weight: 800;
            color: #ff9500;
            margin: 8px 0;
            text-shadow: 0 2px 10px rgba(255, 149, 0, 0.3);
        }

        .bonus-spins {
            font-size: clamp(16px, 3.5vw, 20px);
            font-weight: 600;
            color: var(--accent-green);
        }

        .popup-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .popup-btn {
            width: 100%;
            padding: 16px 24px;
            border-radius: 14px;
            font-size: clamp(14px, 3vw, 16px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .popup-btn-primary {
            background: var(--button-gradient);
            border: none;
            color: #1a1a2e;
            box-shadow: var(--button-shadow);
        }

        .popup-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 183, 0, 0.5);
        }

        .popup-btn-secondary {
            background: transparent;
            border: 2px solid rgba(26, 26, 46, 0.2);
            color: var(--text-primary);
        }

        .popup-btn-secondary:hover {
            background: rgba(26, 26, 46, 0.05);
        }

        /* Result Popup Specific */
        .result-multiplier {
            font-size: clamp(36px, 8vw, 48px);
            font-weight: 800;
            color: var(--accent-green);
            margin-bottom: 8px;
        }

        .result-amount {
            font-size: clamp(28px, 6vw, 36px);
            font-weight: 700;
            color: #ffd700;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.4);
        }

        /* End Card */
        .end-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 24px;
            padding: 40px 28px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .end-card-logo {
            font-size: clamp(28px, 6vw, 36px);
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 24px;
            letter-spacing: 2px;
        }

        .end-card-bonus {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .end-card-bonus-title {
            font-size: clamp(14px, 3vw, 16px);
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .end-card-bonus-amount {
            font-size: clamp(24px, 5vw, 32px);
            font-weight: 800;
            color: #ffd700;
            margin-bottom: 4px;
        }

        .end-card-bonus-spins {
            font-size: clamp(16px, 3.5vw, 20px);
            color: var(--accent-green);
            font-weight: 600;
        }

        .end-card-cta {
            width: 100%;
            padding: 18px 24px;
            background: var(--button-gradient);
            border: none;
            border-radius: 14px;
            color: #1a1a2e;
            font-size: clamp(16px, 3.5vw, 18px);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: var(--button-shadow);
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .end-card-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 183, 0, 0.5);
        }

        .end-card-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .age-restriction {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
        }

        /* Utility */
        .hidden {
            display: none !important;
        }

        /* Responsive adjustments for ultra-wide screens */
        @media (min-aspect-ratio: 21/9) {
            .game-container {
                max-width: 380px;
            }
        }

        /* Responsive adjustments for tall screens */
        @media (max-aspect-ratio: 9/19.5) {
            .game-container {
                gap: 8px;
            }
            
            .logo {
                padding: 4px 0;
            }
            
            .game-board {
                padding: 12px;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Logo -->
        <div class="logo">
            <h1>🐔 CHICKEN</h1>
        </div>

        <!-- Balance -->
        <div class="balance-display">
            <div class="balance-label">Balance</div>
            <div class="balance-amount">$<span id="balance">20.00</span></div>
        </div>

        <!-- Chicken Character -->
        <div class="chicken-container">
            <div class="chicken">🐔</div>
        </div>

        <!-- Game Board -->
        <div class="game-board" id="gameBoard">
            <div class="tile" data-index="0">❓</div>
            <div class="tile" data-index="1">❓</div>
            <div class="tile" data-index="2">❓</div>
            <div class="tile" data-index="3">❓</div>
            <div class="tile" data-index="4">❓</div>
            <div class="tile" data-index="5">❓</div>
            <div class="tile" data-index="6">❓</div>
            <div class="tile" data-index="7">❓</div>
            <div class="tile" data-index="8">❓</div>
        </div>

        <!-- Multiplier -->
        <div class="multiplier-display">
            <div class="multiplier-label">Current Multiplier</div>
            <div class="multiplier-value">x<span id="multiplier">1.00</span></div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn btn-plus" id="btnPlus">+</button>
            <button class="btn btn-primary" id="btnStart">Start</button>
            <button class="btn btn-lock" id="btnLockIn">Lock In</button>
        </div>
    </div>

    <!-- Welcome Bonus Popup -->
    <div class="popup-overlay" id="welcomePopup">
        <div class="popup">
            <h2 class="popup-title">Special Offer</h2>
            <div class="popup-content">
                <div class="bonus-text-main">125% Welcome Bonus</div>
                <div class="bonus-amount">Up to $888</div>
                <div class="bonus-spins">+250 Free Spins</div>
            </div>
            <div class="popup-actions">
                <button class="popup-btn popup-btn-primary" id="welcomeClaimBtn">Claim Now</button>
                <button class="popup-btn popup-btn-secondary" id="welcomeLaterBtn">Maybe Later</button>
            </div>
        </div>
    </div>

    <!-- Result Popup -->
    <div class="popup-overlay" id="resultPopup">
        <div class="popup">
            <h2 class="popup-title">Result</h2>
            <div class="popup-content">
                <div class="result-multiplier">x<span id="resultMultiplier">3.00</span></div>
                <div class="result-amount">$<span id="resultAmount">60.00</span></div>
            </div>
            <div class="popup-actions">
                <button class="popup-btn popup-btn-primary" id="resultContinueBtn">Continue</button>
            </div>
        </div>
    </div>

    <!-- End Card -->
    <div class="popup-overlay" id="endCardPopup">
        <div class="end-card">
            <div class="end-card-logo">🐔 CHICKEN</div>
            <div class="end-card-bonus">
                <div class="end-card-bonus-title">Your Bonus</div>
                <div class="end-card-bonus-amount">$<span id="endBonusAmount">888</span></div>
                <div class="end-card-bonus-spins">+250 Free Spins</div>
            </div>
            <button class="end-card-cta" id="endCardCtaBtn">Play Now</button>
            <div class="end-card-footer">
                <span class="age-restriction">18+</span>
                <span>Terms & Conditions Apply</span>
            </div>
        </div>
    </div>

    <script>
        // Game State
        let balance = 20.00;
        let currentBet = 1.00;
        let multiplier = 1.00;
        let gameActive = false;
        let revealedTiles = [];
        const winPositions = [0, 2, 4, 6, 8]; // Positions with chickens (win)
        const losePositions = [1, 3, 5, 7]; // Positions with bombs (lose)

        // DOM Elements
        const balanceEl = document.getElementById('balance');
        const multiplierEl = document.getElementById('multiplier');
        const gameBoard = document.getElementById('gameBoard');
        const tiles = document.querySelectorAll('.tile');
        const btnStart = document.getElementById('btnStart');
        const btnLockIn = document.getElementById('btnLockIn');
        const btnPlus = document.getElementById('btnPlus');
        const welcomePopup = document.getElementById('welcomePopup');
        const resultPopup = document.getElementById('resultPopup');
        const endCardPopup = document.getElementById('endCardPopup');

        // Initialize
        function init() {
            updateBalance();
            setupEventListeners();
            showWelcomePopup();
        }

        // Update Balance Display
        function updateBalance() {
            balanceEl.textContent = balance.toFixed(2);
        }

        // Setup Event Listeners
        function setupEventListeners() {
            btnStart.addEventListener('click', startGame);
            btnLockIn.addEventListener('click', lockIn);
            btnPlus.addEventListener('click', increaseBet);
            
            tiles.forEach(tile => {
                tile.addEventListener('click', () => handleTileClick(tile));
            });

            document.getElementById('welcomeClaimBtn').addEventListener('click', () => {
                hidePopup(welcomePopup);
                setTimeout(() => showEndCard(), 500);
            });

            document.getElementById('welcomeLaterBtn').addEventListener('click', () => {
                hidePopup(welcomePopup);
            });

            document.getElementById('resultContinueBtn').addEventListener('click', () => {
                hidePopup(resultPopup);
                resetGame();
            });

            document.getElementById('endCardCtaBtn').addEventListener('click', () => {
                hidePopup(endCardPopup);
                resetGame();
            });
        }

        // Show Popup
        function showPopup(popup) {
            popup.classList.add('active');
        }

        // Hide Popup
        function hidePopup(popup) {
            popup.classList.remove('active');
        }

        // Show Welcome Popup
        function showWelcomePopup() {
            setTimeout(() => showPopup(welcomePopup), 500);
        }

        // Show Result Popup
        function showResultPopup(mult, amount) {
            document.getElementById('resultMultiplier').textContent = mult.toFixed(2);
            document.getElementById('resultAmount').textContent = amount.toFixed(2);
            showPopup(resultPopup);
        }

        // Show End Card
        function showEndCard() {
            document.getElementById('endBonusAmount').textContent = '888';
            showPopup(endCardPopup);
        }

        // Start Game
        function startGame() {
            if (gameActive) return;
            if (balance < currentBet) {
                alert('Insufficient balance!');
                return;
            }

            gameActive = true;
            balance -= currentBet;
            multiplier = 1.00;
            revealedTiles = [];
            
            updateBalance();
            updateMultiplier();
            resetTiles();
            
            btnStart.textContent = 'Playing...';
            btnStart.disabled = true;
        }

        // Reset Tiles
        function resetTiles() {
            tiles.forEach(tile => {
                tile.className = 'tile';
                tile.textContent = '❓';
                tile.style.pointerEvents = 'auto';
            });
        }

        // Handle Tile Click
        function handleTileClick(tile) {
            if (!gameActive) return;
            
            const index = parseInt(tile.dataset.index);
            if (revealedTiles.includes(index)) return;

            revealedTiles.push(index);
            tile.classList.add('revealed');

            if (winPositions.includes(index)) {
                // Win - show chicken
                tile.classList.add('win');
                tile.textContent = '🐔';
                multiplier += 0.5;
                updateMultiplier();
                
                // Check if all win positions revealed
                const allWinRevealed = winPositions.every(pos => revealedTiles.includes(pos));
                if (allWinRevealed) {
                    endGame(true);
                }
            } else {
                // Lose - show bomb
                tile.classList.add('lose');
                tile.textContent = '💣';
                endGame(false);
            }
        }

        // Update Multiplier Display
        function updateMultiplier() {
            multiplierEl.textContent = multiplier.toFixed(2);
        }

        // Lock In
        function lockIn() {
            if (!gameActive) return;
            endGame(true);
        }

        // End Game
        function endGame(win) {
            gameActive = false;
            
            if (win) {
                const winAmount = currentBet * multiplier;
                balance += winAmount;
                updateBalance();
                showResultPopup(multiplier, winAmount);
            } else {
                updateBalance();
                showResultPopup(0, 0);
            }
            
            btnStart.textContent = 'Start';
            btnStart.disabled = false;
            
            // Disable further clicks
            tiles.forEach(tile => {
                tile.style.pointerEvents = 'none';
            });
        }

        // Reset Game
        function resetGame() {
            gameActive = false;
            multiplier = 1.00;
            revealedTiles = [];
            updateMultiplier();
            resetTiles();
            btnStart.textContent = 'Start';
            btnStart.disabled = false;
        }

        // Increase Bet
        function increaseBet() {
            if (gameActive) return;
            currentBet = Math.min(currentBet + 1, balance);
        }

        // Initialize on load
        init();
    </script>
