<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Chicken Game</title>
    <style>
        :root {
            --primary-gold: #ffd700;
            --primary-gold-dark: #b89b00;
            --secondary-green: #2ecc71;
            --secondary-green-dark: #27ae60;
            --bg-dark: #1a1a2e;
            --bg-card: #16213e;
            --bg-panel: #0f3460;
            --text-white: #ffffff;
            --text-gold: #ffd700;
            --shadow-strong: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-medium: 0 4px 16px rgba(0, 0, 0, 0.3);
            --shadow-light: 0 2px 8px rgba(0, 0, 0, 0.2);
            --glow-gold: 0 0 20px rgba(255, 215, 0, 0.5);
            --glow-green: 0 0 20px rgba(46, 204, 113, 0.5);
            --border-radius-sm: 8px;
            --border-radius-md: 12px;
            --border-radius-lg: 16px;
            --border-radius-xl: 24px;
            --safe-area-top: env(safe-area-inset-top, 20px);
            --safe-area-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-panel) 100%);
            color: var(--text-white);
        }

        .game-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: calc(var(--safe-area-top) + 10px) clamp(12px, 3vw, 20px) calc(var(--safe-area-bottom) + 10px);
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 clamp(4px, 1vw, 8px);
            margin-bottom: clamp(8px, 2vh, 16px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: clamp(6px, 1.5vw, 10px);
        }

        .logo-icon {
            width: clamp(28px, 6vw, 40px);
            height: clamp(28px, 6vw, 40px);
            background: linear-gradient(135deg, var(--primary-gold), var(--primary-gold-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(16px, 4vw, 24px);
            box-shadow: var(--glow-gold);
        }

        .logo-text {
            font-size: clamp(18px, 4vw, 26px);
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-gold), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            letter-spacing: 1px;
        }

        .balance-container {
            display: flex;
            align-items: center;
            gap: clamp(6px, 1.5vw, 10px);
            background: linear-gradient(135deg, var(--bg-card), var(--bg-panel));
            padding: clamp(6px, 1.5vh, 10px) clamp(10px, 2.5vw, 16px);
            border-radius: var(--border-radius-xl);
            box-shadow: var(--shadow-medium);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .balance-label {
            font-size: clamp(11px, 2.5vw, 14px);
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .balance-amount {
            font-size: clamp(14px, 3.5vw, 18px);
            font-weight: 700;
            color: var(--primary-gold);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Game Area */
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 3vh, 20px);
            padding: clamp(8px, 2vh, 16px) 0;
        }

        .chicken-container {
            position: relative;
            width: clamp(80px, 20vw, 120px);
            height: clamp(80px, 20vw, 120px);
            animation: chickenBounce 1.5s ease-in-out infinite;
        }

        @keyframes chickenBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .chicken {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(40px, 10vw, 60px);
            box-shadow: var(--shadow-strong), 0 0 30px rgba(255, 107, 107, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.2);
        }

        .multiplier-display {
            text-align: center;
            padding: clamp(8px, 2vh, 12px) clamp(16px, 4vw, 24px);
            background: linear-gradient(135deg, var(--bg-card), var(--bg-panel));
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-medium);
            border: 1px solid rgba(255, 215, 0, 0.15);
        }

        .multiplier-label {
            font-size: clamp(10px, 2.5vw, 12px);
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .multiplier-value {
            font-size: clamp(24px, 6vw, 36px);
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-gold), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        /* Game Board */
        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: clamp(4px, 1vw, 8px);
            width: 100%;
            max-width: 320px;
            padding: clamp(8px, 2vh, 12px);
            background: linear-gradient(135deg, var(--bg-card), var(--bg-panel));
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-medium);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tile {
            aspect-ratio: 1;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border-radius: var(--border-radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(14px, 4vw, 20px);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .tile::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .tile:hover::before {
            opacity: 1;
        }

        .tile:active {
            transform: scale(0.95);
        }

        .tile.revealed {
            background: linear-gradient(135deg, var(--secondary-green), var(--secondary-green-dark));
            border-color: rgba(46, 204, 113, 0.5);
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        }

        .tile.bomb {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-color: rgba(231, 76, 60, 0.5);
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }

        /* Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 2vh, 12px);
            width: 100%;
            max-width: 320px;
            margin-top: auto;
        }

        .bet-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: clamp(8px, 2vw, 12px);
            padding: clamp(8px, 2vh, 12px);
            background: linear-gradient(135deg, var(--bg-card), var(--bg-panel));
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-medium);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bet-label {
            font-size: clamp(11px, 2.5vw, 13px);
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .bet-value {
            font-size: clamp(14px, 3.5vw, 18px);
            font-weight: 700;
            color: var(--text-white);
        }

        .bet-adjust {
            display: flex;
            align-items: center;
            gap: clamp(4px, 1vw, 8px);
        }

        .btn-circle {
            width: clamp(32px, 7vw, 40px);
            height: clamp(32px, 7vw, 40px);
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--primary-gold), var(--primary-gold-dark));
            color: var(--bg-dark);
            font-size: clamp(18px, 4vw, 24px);
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-light);
            transition: all 0.2s ease;
        }

        .btn-circle:active {
            transform: scale(0.9);
        }

        .btn-primary {
            width: 100%;
            padding: clamp(12px, 3vh, 16px) clamp(16px, 4vw, 24px);
            border: none;
            border-radius: var(--border-radius-xl);
            font-size: clamp(14px, 3.5vw, 18px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-start {
            background: linear-gradient(135deg, var(--secondary-green), var(--secondary-green-dark));
            color: var(--text-white);
            box-shadow: var(--glow-green), var(--shadow-medium);
        }

        .btn-start:active {
            transform: scale(0.98);
            box-shadow: var(--shadow-light);
        }

        .btn-lock {
            background: linear-gradient(135deg, var(--primary-gold), var(--primary-gold-dark));
            color: var(--bg-dark);
            box-shadow: var(--glow-gold), var(--shadow-medium);
        }

        .btn-lock:active {
            transform: scale(0.98);
            box-shadow: var(--shadow-light);
        }

        /* Popups */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: clamp(16px, 4vw, 24px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .popup {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-panel));
            border-radius: var(--border-radius-xl);
            padding: clamp(20px, 5vh, 32px);
            max-width: 340px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow-strong);
            border: 1px solid rgba(255, 215, 0, 0.2);
            transform: scale(0.9) translateY(20px);
            transition: all 0.3s ease;
        }

        .popup-overlay.active .popup {
            transform: scale(1) translateY(0);
        }

        .popup-title {
            font-size: clamp(18px, 4vw, 24px);
            font-weight: 700;
            color: var(--text-white);
            margin-bottom: clamp(12px, 3vh, 16px);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .popup-content {
            margin-bottom: clamp(16px, 4vh, 24px);
        }

        .bonus-percent {
            font-size: clamp(28px, 7vw, 42px);
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-gold), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: clamp(8px, 2vh, 12px);
            line-height: 1.2;
        }

        .bonus-title {
            font-size: clamp(14px, 3.5vw, 18px);
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: clamp(12px, 3vh, 16px);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bonus-amount {
            font-size: clamp(20px, 5vw, 28px);
            font-weight: 700;
            color: var(--secondary-green);
            margin-bottom: clamp(4px, 1vh, 8px);
            text-shadow: 0 2px 8px rgba(46, 204, 113, 0.4);
        }

        .bonus-spins {
            font-size: clamp(16px, 4vw, 22px);
            font-weight: 600;
            color: var(--primary-gold);
            text-shadow: 0 2px 8px rgba(255, 215, 0, 0.4);
        }

        .result-multiplier {
            font-size: clamp(32px, 8vw, 48px);
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-gold), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: clamp(8px, 2vh, 12px);
            line-height: 1.2;
        }

        .result-win {
            font-size: clamp(24px, 6vw, 36px);
            font-weight: 700;
            color: var(--secondary-green);
            text-shadow: 0 2px 12px rgba(46, 204, 113, 0.5);
        }

        .popup-buttons {
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 2vh, 12px);
        }

        .btn-claim {
            background: linear-gradient(135deg, var(--secondary-green), var(--secondary-green-dark));
            color: var(--text-white);
            box-shadow: var(--glow-green), var(--shadow-medium);
        }

        .btn-play {
            background: linear-gradient(135deg, var(--primary-gold), var(--primary-gold-dark));
            color: var(--bg-dark);
            box-shadow: var(--glow-gold), var(--shadow-medium);
        }

        /* End Card */
        .end-card {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-panel));
            border-radius: var(--border-radius-xl);
            padding: clamp(24px, 6vh, 40px);
            max-width: 340px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow-strong);
            border: 1px solid rgba(255, 215, 0, 0.2);
            transform: scale(0.9) translateY(20px);
            transition: all 0.3s ease;
        }

        .popup-overlay.active .end-card {
            transform: scale(1) translateY(0);
        }

        .end-logo {
            margin-bottom: clamp(16px, 4vh, 24px);
        }

        .end-logo-icon {
            width: clamp(48px, 10vw, 64px);
            height: clamp(48px, 10vw, 64px);
            background: linear-gradient(135deg, var(--primary-gold), var(--primary-gold-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(24px, 6vw, 32px);
            box-shadow: var(--glow-gold);
            margin: 0 auto clamp(8px, 2vh, 12px);
        }

        .end-logo-text {
            font-size: clamp(20px, 5vw, 28px);
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-gold), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .end-bonus-box {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 215, 0, 0.05));
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: var(--border-radius-lg);
            padding: clamp(12px, 3vh, 16px);
            margin-bottom: clamp(16px, 4vh, 24px);
        }

        .end-bonus-title {
            font-size: clamp(12px, 3vw, 14px);
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: clamp(4px, 1vh, 8px);
        }

        .end-bonus-value {
            font-size: clamp(18px, 4.5vw, 24px);
            font-weight: 700;
            color: var(--primary-gold);
            text-shadow: var(--glow-gold);
        }

        .end-cta {
            margin-bottom: clamp(16px, 4vh, 24px);
        }

        .end-disclaimer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(8px, 2vw, 12px);
            margin-top: clamp(12px, 3vh, 16px);
            padding-top: clamp(12px, 3vh, 16px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .age-restriction {
            background: rgba(255, 255, 255, 0.1);
            padding: clamp(4px, 1vh, 6px) clamp(8px, 2vw, 12px);
            border-radius: var(--border-radius-sm);
            font-size: clamp(10px, 2.5vw, 12px);
            font-weight: 700;
            color: rgba(255, 255, 255, 0.6);
        }

        .terms-link {
            font-size: clamp(10px, 2.5vw, 12px);
            color: rgba(255, 255, 255, 0.5);
            text-decoration: underline;
            cursor: pointer;
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shine {
            0% { background-position: -200%; }
            100% { background-position: 200%; }
        }

        .pulse-animation {
            animation: pulse 2s ease-in-out infinite;
        }

        /* Responsive adjustments for ultra-wide screens */
        @media (min-aspect-ratio: 21/9) {
            .game-container {
                max-width: 500px;
                margin: 0 auto;
            }
        }

        /* Responsive adjustments for tall screens */
        @media (max-aspect-ratio: 9/19.5) {
            .game-area {
                gap: clamp(8px, 2vh, 12px);
            }
            
            .controls {
                gap: clamp(6px, 1.5vh, 10px);
            }
        }

        /* Landscape mode */
        @media (orientation: landscape) and (max-height: 500px) {
            .game-container {
                flex-direction: row;
                align-items: center;
                justify-content: center;
            }

            .header {
                position: absolute;
                top: calc(var(--safe-area-top) + 8px);
                left: clamp(12px, 3vw, 20px);
                right: clamp(12px, 3vw, 20px);
                margin-bottom: 0;
            }

            .game-area {
                flex-direction: row;
                gap: clamp(16px, 3vw, 24px);
            }

            .controls {
                position: absolute;
                bottom: calc(var(--safe-area-bottom) + 8px);
                left: clamp(12px, 3vw, 20px);
                right: clamp(12px, 3vw, 20px);
                max-width: none;
                margin-top: 0;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">🐔</div>
                <div class="logo-text">CHICKEN</div>
            </div>
            <div class="balance-container">
                <span class="balance-label">Balance</span>
                <span class="balance-amount">$<span id="balance">20.00</span></span>
            </div>
        </header>

        <!-- Game Area -->
        <main class="game-area">
            <div class="chicken-container">
                <div class="chicken">🐔</div>
            </div>

            <div class="multiplier-display">
                <div class="multiplier-label">Current Multiplier</div>
                <div class="multiplier-value" id="multiplier">x1.00</div>
            </div>

            <div class="game-board" id="gameBoard">
                <!-- Tiles generated by JS -->
            </div>
        </main>

        <!-- Controls -->
        <div class="controls">
            <div class="bet-controls">
                <span class="bet-label">Bet Amount</span>
                <div class="bet-adjust">
                    <button class="btn-circle" id="btnDecrease">−</button>
                    <span class="bet-value">$<span id="betAmount">1.00</span></span>
                    <button class="btn-circle" id="btnIncrease">+</button>
                </div>
            </div>

            <button class="btn-primary btn-start" id="btnStart">Start</button>
            <button class="btn-primary btn-lock" id="btnLock" style="display: none;">Lock In $<span id="lockAmount">20.00</span></button>
        </div>
    </div>

    <!-- Welcome Bonus Popup -->
    <div class="popup-overlay" id="welcomePopup">
        <div class="popup">
            <h2 class="popup-title">Special Offer</h2>
            <div class="popup-content">
                <div class="bonus-percent">125%</div>
                <div class="bonus-title">Welcome Bonus</div>
                <div class="bonus-amount">Up to $888</div>
                <div class="bonus-spins">+250 Free Spins</div>
            </div>
            <div class="popup-buttons">
                <button class="btn-primary btn-claim" id="btnClaimBonus">Claim Now</button>
            </div>
        </div>
    </div>

    <!-- Result Popup -->
    <div class="popup-overlay" id="resultPopup">
        <div class="popup">
            <h2 class="popup-title">Result</h2>
            <div class="popup-content">
                <div class="result-multiplier" id="resultMultiplier">x3.00</div>
                <div class="result-win">$<span id="resultWin">60.00</span></div>
            </div>
            <div class="popup-buttons">
                <button class="btn-primary btn-play" id="btnPlayAgain">Play Again</button>
            </div>
        </div>
    </div>

    <!-- End Card Popup -->
    <div class="popup-overlay" id="endCardPopup">
        <div class="end-card">
            <div class="end-logo">
                <div class="end-logo-icon">🐔</div>
                <div class="end-logo-text">CHICKEN</div>
            </div>

            <div class="end-bonus-box">
                <div class="end-bonus-title">Your Bonus</div>
                <div class="end-bonus-value">125% Up to $888 + 250 FS</div>
            </div>

            <div class="end-cta">
                <button class="btn-primary btn-play" id="btnEndPlay">Play Now</button>
            </div>

            <div class="end-disclaimer">
                <span class="age-restriction">18+</span>
                <span class="terms-link">Terms & Conditions Apply</span>
            </div>
        </div>
    </div>

    <script>
        // Game State
        let balance = 20.00;
        let betAmount = 1.00;
        let currentMultiplier = 1.00;
        let isPlaying = false;
        let revealedTiles = 0;
        const totalTiles = 25;
        const bombCount = 5;
        let bombs = [];

        // DOM Elements
        const balanceEl = document.getElementById('balance');
        const betAmountEl = document.getElementById('betAmount');
        const lockAmountEl = document.getElementById('lockAmount');
        const multiplierEl = document.getElementById('multiplier');
        const gameBoard = document.getElementById('gameBoard');
        const btnStart = document.getElementById('btnStart');
        const btnLock = document.getElementById('btnLock');
        const btnIncrease = document.getElementById('btnIncrease');
        const btnDecrease = document.getElementById('btnDecrease');
        const welcomePopup = document.getElementById('welcomePopup');
        const resultPopup = document.getElementById('resultPopup');
        const endCardPopup = document.getElementById('endCardPopup');
        const btnClaimBonus = document.getElementById('btnClaimBonus');
        const btnPlayAgain = document.getElementById('btnPlayAgain');
        const btnEndPlay = document.getElementById('btnEndPlay');
        const resultMultiplier = document.getElementById('resultMultiplier');
        const resultWin = document.getElementById('resultWin');

        // Initialize Game Board
        function initGameBoard() {
            gameBoard.innerHTML = '';
            for (let i = 0; i < totalTiles; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.dataset.index = i;
                tile.textContent = '❓';
                tile.addEventListener('click', () => handleTileClick(i));
                gameBoard.appendChild(tile);
            }
        }

        // Generate Bombs
        function generateBombs() {
            bombs = [];
            while (bombs.length < bombCount) {
                const random = Math.floor(Math.random() * totalTiles);
                if (!bombs.includes(random)) {
                    bombs.push(random);
                }
            }
        }

        // Handle Tile Click
        function handleTileClick(index) {
            if (!isPlaying) return;

            const tile = gameBoard.children[index];
            if (tile.classList.contains('revealed') || tile.classList.contains('bomb')) return;

            if (bombs.includes(index)) {
                // Hit a bomb
                tile.classList.add('bomb');
                tile.textContent = '💣';
                endGame(false);
            } else {
                // Safe tile
                tile.classList.add('revealed');
                tile.textContent = '🍗';
                revealedTiles++;
                currentMultiplier = calculateMultiplier(revealedTiles);
                multiplierEl.textContent = `x${currentMultiplier.toFixed(2)}`;
                updateLockButton();

                // Check if all safe tiles revealed
                if (revealedTiles === totalTiles - bombCount) {
                    endGame(true);
                }
            }
        }

        // Calculate Multiplier
        function calculateMultiplier(revealed) {
            const baseMultiplier = 1.0;
            const increment = 0.2;
            return baseMultiplier + (revealed * increment);
        }

        // Update Lock Button
        function updateLockButton() {
            const winAmount = betAmount * currentMultiplier;
            lockAmountEl.textContent = winAmount.toFixed(2);
        }

        // Start Game
        function startGame() {
            if (betAmount > balance) {
                alert('Insufficient balance!');
                return;
            }

            balance -= betAmount;
            balanceEl.textContent = balance.toFixed(2);
            
            isPlaying = true;
            currentMultiplier = 1.00;
            revealedTiles = 0;
            multiplierEl.textContent = 'x1.00';
            
            generateBombs();
            initGameBoard();
            
            btnStart.style.display = 'none';
            btnLock.style.display = 'block';
            updateLockButton();
        }

        // Lock In Winnings
        function lockIn() {
            if (!isPlaying) return;

            const winAmount = betAmount * currentMultiplier;
            balance += winAmount;
            balanceEl.textContent = balance.toFixed(2);

            endGame(true, winAmount);
        }

        // End Game
        function endGame(won, winAmount = 0) {
            isPlaying = false;
            
            // Reveal all bombs
            bombs.forEach(index => {
                const tile = gameBoard.children[index];
                if (!tile.classList.contains('revealed')) {
                    tile.classList.add('bomb');
                    tile.textContent = '💣';
                }
            });

            btnStart.style.display = 'block';
            btnLock.style.display = 'none';

            if (won && winAmount > 0) {
                setTimeout(() => {
                    resultMultiplier.textContent = `x${currentMultiplier.toFixed(2)}`;
                    resultWin.textContent = winAmount.toFixed(2);
                    resultPopup.classList.add('active');
                }, 500);
            } else if (!won) {
                // Show end card on loss
                setTimeout(() => {
                    endCardPopup.classList.add('active');
                }, 500);
            }
        }

        // Increase Bet
        function increaseBet() {
            const increments = [1, 2, 5, 10, 20];
            const currentIndex = increments.indexOf(betAmount);
            if (currentIndex < increments.length - 1) {
                betAmount = increments[currentIndex + 1];
                betAmountEl.textContent = betAmount.toFixed(2);
            }
        }

        // Decrease Bet
        function decreaseBet() {
            const increments = [1, 2, 5, 10, 20];
            const currentIndex = increments.indexOf(betAmount);
            if (currentIndex > 0) {
                betAmount = increments[currentIndex - 1];
                betAmountEl.textContent = betAmount.toFixed(2);
            }
        }

        // Close Popups
        function closePopups() {
            welcomePopup.classList.remove('active');
            resultPopup.classList.remove('active');
            endCardPopup.classList.remove('active');
        }

        // Event Listeners
        btnStart.addEventListener('click', startGame);
        btnLock.addEventListener('click', lockIn);
        btnIncrease.addEventListener('click', increaseBet);
        btnDecrease.addEventListener('click', decreaseBet);
        btnClaimBonus.addEventListener('click', () => {
            closePopups();
            setTimeout(() => {
                endCardPopup.classList.add('active');
            }, 300);
        });
        btnPlayAgain.addEventListener('click', closePopups);
        btnEndPlay.addEventListener('click', closePopups);

        // Initialize
        initGameBoard();

        // Show welcome popup after a short delay
        setTimeout(() => {
            welcomePopup.classList.add('active');
        }, 500);
    </script>
</body>
</html>
